<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodiAI</title><link rel="stylesheet" href="/interface.css"><link rel="stylesheet" href="/performance.css"><link rel="stylesheet" href="/refinements.css"><script src="/app.js" defer></script><script src="/learning.js" defer></script><script src="/voice.js" defer></script></head>
<body>
<svg class="icon-bank" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5v15M12 5C9 3 6 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Z"/></symbol>
<symbol id="i-memory" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-5 3 4 4 0 0 0-1 7 4 4 0 0 0 6 5M15 4a3 3 0 0 1 5 3 4 4 0 0 1 1 7 4 4 0 0 1-6 5M9 4v16M15 4v16M6 10h3M15 10h3M6 16h3M15 16h3"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3V7Z"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
<symbol id="i-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-12-2 14"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-attach" viewBox="0 0 24 24"><path d="m9 14 7-7a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l9-9a2 2 0 0 1 3 3l-9 9"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor" stroke="none"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L20 8a2 2 0 0 0-4-4L5 15l-1 5Z"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="m9 3 6 0-1 6 4 4v2H6v-2l4-4-1-6ZM12 15v6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="3"/><path d="M15 8V3H3v12h5"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-2 8M20 4v6h-6"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
<symbol id="i-language" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2M5 5c0 6 4 9 8 10M13 5c0 6-4 9-9 11M14 21l4-10 4 10M16 17h4"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 3v17h17M9 16v-5M14 16V7M19 16V4"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15a9 9 0 0 1-11-11 9 9 0 1 0 11 11Z"/></symbol>
<symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1-4 2 2 0 0 1 1-4h3a3 3 0 0 0 3-3c0-4-5-7-9-7Z"/><circle cx="7" cy="10" r="1"/><circle cx="10" cy="6.5" r="1"/><circle cx="15" cy="7" r="1"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="2"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol></defs></svg>
<aside class="sidebar">
<div class="sidebar-top"><a class="brand" href="/" aria-label="CodiAI"><span class="brand-mark">c<span>•</span></span>CodiAI</a><button id="sidebar-collapse" class="icon-button" title="Свернуть боковую панель"><svg class="icon"><use href="#i-menu"/></svg></button></div>
<button id="new-chat" class="new-chat"><svg class="icon"><use href="#i-edit"/></svg>Новый чат</button>
<nav aria-label="Разделы"><button id="desktop-widget"><svg class="icon"><use href="#i-spark"/></svg>Помощник на экране</button><button data-panel="models"><svg class="icon"><use href="#i-grid"/></svg>Модели</button><button data-panel="browser"><svg class="icon"><use href="#i-search"/></svg>Браузер</button><button data-panel="knowledge"><svg class="icon"><use href="#i-book"/></svg>Знания</button><button data-panel="memory"><svg class="icon"><use href="#i-memory"/></svg>Память</button><button data-panel="tools"><svg class="icon"><use href="#i-folder"/></svg>Проект</button></nav>
<div class="history-label">Недавние чаты<button id="refresh-chats" class="icon-button" title="Обновить чаты"><svg class="icon"><use href="#i-refresh"/></svg></button></div><div id="chat-list" class="chat-list"></div>
<div class="sidebar-bottom"><button data-panel="settings" class="profile-button"><span class="profile-avatar">C</span><span><strong>Мой CodiAI</strong><small>Настройки и оформление</small></span><svg class="icon"><use href="#i-settings"/></svg></button><div class="local-note"><span class="dot"></span>Работает на вашем компьютере</div></div>
</aside>
<main>
<header><div class="header-start"><button id="mobile-menu" class="icon-button" title="Открыть меню"><svg class="icon"><use href="#i-menu"/></svg></button><button id="model-shortcut" data-panel="models">Initial 0.2 ▾</button><span id="connection" class="status-pill">Подключение…</span></div><button data-panel="settings" class="icon-button" title="Настройки"><svg class="icon"><use href="#i-settings"/></svg></button></header>
<div class="mode-bar"><select id="mode-select" aria-label="Режим работы" hidden></select><button id="mode-picker" type="button" aria-label="Выбрать режим"><span id="mode-name">Ассистент</span><svg class="icon"><use href="#i-chevron"/></svg></button><span class="mode-hint" id="mode-hint"></span></div>
<div id="coding-bar" class="coding-bar" hidden><button data-pick-workspace="true">Выбрать папку</button><span id="workspace-short"></span><button data-vibe="Изучи структуру подключённого проекта и объясни, как он устроен. Используй инструменты чтения.">Обзор проекта</button><button data-vibe="Помоги исправить ошибку в проекте. Уточни симптомы, затем найди причину в файлах.">Исправить ошибку</button><button data-vibe="Хочу добавить функцию в проект. Сначала уточни, что она должна делать, затем предложи небольшой план.">Добавить функцию</button><button data-panel="tools">Правки и откат</button></div>
<section id="welcome" class="welcome"><div class="character-wrap"><img id="mascot" src="/assets/original.png" alt="Маскот CodiAI"></div><h1>Что создадим сегодня?</h1><p>Ваши идеи. Ваш темп. Ваш ассистент.</p><div id="setup-banner" class="setup-banner" hidden>Нужна локальная модель. <button data-panel="models">Выбрать модель</button></div></section>
<section id="messages" class="messages" aria-live="polite" hidden></section>
<div class="composer-area"><div id="activity" class="activity" aria-live="polite"></div>
<div id="voice-panel" class="voice-panel" hidden><div class="voice-top"><strong id="voice-status" role="status">Голосовой ввод</strong><span id="voice-time">0:00</span><button type="button" id="voice-close" aria-label="Закрыть панель микрофона" title="Закрыть и остановить запись"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><label class="voice-device-label">Микрофон <select id="voice-device" aria-label="Микрофон для голосового ввода"></select></label><progress id="voice-level" max="100" value="0" aria-label="Уровень звука микрофона"></progress><p id="voice-hint"></p><div class="voice-actions"><button type="button" id="voice-cancel">Отменить</button><button type="button" id="voice-done">Готово · распознать</button></div></div><div id="attachments" class="attachments" hidden></div><form id="composer"><textarea id="message" rows="2" maxlength="16000" placeholder="Спросите что-нибудь или опишите задачу…" aria-label="Сообщение"></textarea><div class="composer-controls"><div><button type="button" id="voice-button" title="Записать голосовое сообщение" aria-label="Записать голос" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span>Голос</span></button><button type="button" id="image-button" title="Прикрепить картинку"><svg class="icon"><use href="#i-image"/></svg><span>Картинка</span></button><button type="button" id="attach-button" class="icon-button" title="Добавить текстовый документ"><svg class="icon"><use href="#i-attach"/></svg><span>Документ</span></button><button type="button" id="tools-toggle" title="Разрешить локальные инструменты"><svg class="icon"><use href="#i-code"/></svg><span>Действия</span></button><button type="button" id="thinking-toggle" title="Размышление модели"><svg class="icon"><use href="#i-spark"/></svg><span>Размышление</span></button></div><div><button type="button" id="stop-button" hidden><svg class="icon"><use href="#i-stop"/></svg><span>Остановить</span></button><button id="send-button" class="send" type="submit" title="Отправить"><svg class="icon"><use href="#i-arrow"/></svg></button></div></div></form>
<div id="suggestions" class="suggestions"><button data-mode="programmer" data-prompt="Помоги разобраться в моём проекте. Сначала уточни, что я хочу сделать."><svg class="icon"><use href="#i-code"/></svg>Написать код</button><button data-mode="teacher" data-prompt="Объясни, как устроена нейросеть, простыми словами. Потом задай вопрос для проверки понимания."><svg class="icon"><use href="#i-book"/></svg>Узнать новое</button><button data-mode="roleplay" data-prompt="Давай придумаем мир для приключения. Предложи три идеи начала, а персонажа я выберу сам."><svg class="icon"><use href="#i-spark"/></svg>Придумать историю</button></div>
<div class="composer-note">Ответы могут содержать ошибки.<span id="backend-note"></span></div></div>
</main>
<input id="memory-import-input" type="file" accept=".json,application/json" hidden><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><input id="file-input" type="file" accept=".txt,.md,.csv,.json,.py,.js,.ts,.html,.css,.yaml,.yml,.toml" hidden>
<dialog id="panel"><div class="panel-header"><div><span class="eyebrow">CODIAI</span><h2 id="panel-title"></h2></div><button id="close-panel" class="icon-button" title="Закрыть"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="panel-content"></div></dialog>
<div id="toast" role="status" hidden></div>
</body></html>
